---
- name: restart nginx
  become: true
  ansible.builtin.systemd_service:
    name: "nginx.service"
    state: restarted
    daemon-reload: true
    enabled: true

- name: Reload nginx
  become: true
  ansible.builtin.systemd_service:
    name: "nginx.service"
    state: reloaded

- name: Renew certificates
  become: true
  ansible.builtin.command:
    cmd: "/usr/bin/dehydrated -c"
